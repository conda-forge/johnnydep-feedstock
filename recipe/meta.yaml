{% set name = "johnnydep" %}
{% set version = "2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/johnnydep-{{ version }}.tar.gz
  sha256: 64296fedfdb98afdcec72f9dd68779bb99fd88eb42935730db3ba6ace8442b99

build:
  entry_points:
    - johnnydep = johnnydep.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - importlib-metadata
    - python >={{ python_min }}
    - loguru
    - packaging >=17,!=22
    - pyyaml
    - rich
    - tomli-w
    - unearth
    - uv

test:
  imports:
    - johnnydep
  commands:
    # no pip check: conda-forge's uv is the bare binary without Python metadata
    - johnnydep --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/wimglenn/johnnydep
  summary: Display dependency tree of Python distribution
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
